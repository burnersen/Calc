<div id="app">
  <header class="bar">
    <button class="ib" id="btnHist" type="button" data-i18n-label="Verlauf" data-i18n-title="Verlauf"></button>
    <div class="seg" role="tablist" data-i18n-label="Modus">
      <span class="thumb" aria-hidden="true"></span>
      <button type="button" role="tab" aria-selected="true"><span class="long" data-i18n="Einfach">Einfach</span><span class="short" data-i18n="Einfach">Einfach</span></button>
      <button type="button" role="tab" aria-selected="false"><span class="long" data-i18n="Wissenschaftlich">Wissenschaftlich</span><span class="short" data-i18n="Wissensch.">Wissensch.</span></button>
      <button type="button" role="tab" aria-selected="false"><span class="long" data-i18n="Büro">Büro</span><span class="short" data-i18n="Büro">Büro</span></button>
    </div>
    <button class="ib" id="btnTheme" type="button" data-i18n-label="Design" data-i18n-title="Design"><svg class="i" aria-hidden="true"><use href="#i-palette"/></svg></button>
    <button class="ib" id="btnMenu" type="button" data-i18n-label="Menü" data-i18n-title="Menü"><svg class="i" aria-hidden="true"><use href="#i-menu"/></svg></button>
